<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel | Cecília Rodrigues</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6ecdf;--bg2:#efe0cc;--card:#fffaf2;--ink:#4a3020;--muted:#7d6552;--gold:#b8863b;--gold2:#8f6420;--line:rgba(184,134,59,.35);--red:#b0443a;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Montserrat,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:8px 18px;border-bottom:1px solid var(--line)}
.top b{font:400 1.9rem 'Great Vibes',cursive;color:var(--gold2)}
main{max-width:880px;margin:auto;padding:18px}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
button,.tab{font:600 .74rem Montserrat;letter-spacing:.08em;text-transform:uppercase;padding:11px 18px;border-radius:30px;border:1px solid var(--line);background:var(--card);color:var(--gold2);cursor:pointer;white-space:nowrap}
.tab.on,button.p{background:var(--gold);color:#fff;border-color:var(--gold)}button.d{color:var(--red);border-color:var(--red)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
input,select,textarea{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;max-width:100%;width:100%}
textarea{min-height:130px}label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.row .sm{flex:0 0 100px}.row button{flex:0 0 auto}
.muted{color:var(--muted);font-size:.85rem}h3{margin:0 0 6px;font:600 1.4rem 'Cormorant Garamond',serif;color:var(--gold2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font:600 1.6rem 'Cormorant Garamond',serif;color:var(--gold2)}.stat span{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.day{font:600 .75rem Montserrat;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin:16px 2px 8px}
.bk{display:flex;gap:12px;align-items:flex-start}.hr{min-width:62px;text-align:center;background:var(--bg2);border-radius:12px;padding:8px 4px;font:600 1.1rem 'Cormorant Garamond',serif;color:var(--gold2)}.bk>div:nth-child(2){flex:1}
.demo{background:var(--gold2);color:#fff;text-align:center;font-size:.78rem;padding:6px}
#login{max-width:340px;margin:80px auto;display:grid;gap:10px}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;display:none;z-index:9}
.hide{display:none!important}
@media(max-width:560px){.bk{flex-direction:column;gap:8px}.hr{align-self:flex-start;padding:6px 12px}}
.md{position:fixed;inset:0;background:rgba(74,48,32,.55);z-index:20;display:grid;place-items:center;padding:10px;overflow:auto}.mb{background:var(--bg);border-radius:20px;padding:16px;max-width:760px;width:100%;max-height:96vh;overflow:auto}
.ec{display:grid;grid-template-columns:minmax(0,270px) 1fr;gap:16px;align-items:start}@media(max-width:620px){.ec{grid-template-columns:1fr}}
.fr{position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;background:#e7cfa4;touch-action:none;cursor:grab;width:100%;max-width:300px;margin:auto;border:1px solid var(--line)}
.fr img,.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}.fr.ct:before,.th.ct:before{content:"";position:absolute;inset:-24px;background:var(--im) center/cover;filter:blur(20px)}.fr.ct img,.th.ct img{object-fit:contain}
.cap{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(60,35,15,.72));color:#fff;pointer-events:none}.cap b{display:block;font:600 1.25rem 'Cormorant Garamond',serif}.cap em{font:600 .85rem Montserrat;font-style:normal;color:#ffe3a8}
.th{position:relative;flex:0 0 84px;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:#e7cfa4}.ph-row{display:flex;gap:12px;align-items:center}.ph-row>div:nth-child(2){flex:1;min-width:0}input[type=range]{padding:0}
</style>
</head>
<body>
<div id="dm" class="demo hide">Modo demonstração: dados de exemplo, nada é salvo de verdade.</div>
<form id="login" class="box hide"><h3 style="font:400 2.2rem 'Great Vibes',cursive">Painel da Cecília</h3>
<input id="em" type="email" placeholder="E-mail" required><input id="pw" type="password" placeholder="Senha" required>
<button class="p" type="submit">Entrar</button><div id="lerr" class="muted"></div></form>

<div id="app" class="hide">
<div class="top"><b>Cecília Rodrigues</b><button id="out" type="button">Sair</button></div>
<main>
<div class="tabs"><span class="tab on" data-t="ag">Agendamentos</span><span class="tab" data-t="sv">Serviços e preços</span><span class="tab" data-t="di">Disponibilidade</span><span class="tab" data-t="st">Site</span><span class="tab" data-t="ft">Fotos</span></div>
<div id="ag"></div><div id="sv" class="hide"></div><div id="di" class="hide"></div><div id="st" class="hide"></div><div id="ft" class="hide"></div>
</main></div>
<div id="ed" class="md hide"><div class="mb"><h3 id="edt">Editar foto</h3>
<div class="ec"><div class="fr" id="fr"><img id="fi" draggable="false" alt=""><div class="cap"><b id="fcn"></b><em id="fcp"></em></div></div>
<div><label>Nome da foto</label><input id="e_t" list="svn" placeholder="Ex.: Maquiagem Social">
<label>Valor na foto (R$, deixe vazio para não mostrar)</label><input id="e_p" type="number" step="0.01" min="0" inputmode="decimal">
<label>Zoom <span id="zv"></span></label><input id="e_z" type="range" min="1" max="3" step="0.01" value="1">
<label>Brilho</label><input id="e_b" type="range" min="70" max="140" value="100">
<label>Contraste</label><input id="e_c" type="range" min="70" max="140" value="100">
<label>Enquadramento</label><select id="e_f"><option value="cover">Preencher o cartão</option><option value="contain">Foto inteira (fundo desfocado)</option></select>
<label style="margin-top:12px"><input id="e_a" type="checkbox" style="width:auto" checked> Visível no site</label>
<div class="row" style="margin-top:10px"><button type="button" id="e_ph">Trocar foto</button><button type="button" id="e_rs">Centralizar</button></div></div></div>
<p class="muted">Arraste a foto para mover, use o zoom (ou a rodinha do mouse) para aproximar. O cartão acima é igual ao do site.</p>
<div class="row"><button class="d" type="button" id="e_x">Cancelar</button><button class="p" type="button" id="e_s">Salvar foto</button></div></div></div>
<input type="file" id="fpick" accept="image/*" class="hide"><datalist id="svn"></datalist>
<datalist id="cats"><option>Maquiagem</option><option>Sobrancelha</option><option>Cílios</option><option>Epilação</option></datalist>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL="https://wulsyjfmrsrzgvrjqvxy.supabase.co", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1bHN5amZtcnNyemd2cmpxdnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3NTc0NTMsImV4cCI6MjEwOTMzMzQ1M30.tj23nnQ_9xMLsN9dUlREVwNdXSDzY8pmL3zTEDw03GQ";
const DEMO=SB_URL.startsWith("COLE");
const DEF={slogan:"Sua beleza, minha arte",intro:"Atendimento exclusivo com horário marcado.",whatsapp:"5541984431403",sinal:"30",
horarios:"08:00,09:00,10:00,11:00,13:00,14:00,15:00,16:00,17:00,18:00",
regras:"Garanta seu horário com antecedência, não haverá encaixe.\nTolerância de atraso de 10 minutos; depois disso o horário é cancelado.\nHorário reservado mediante sinal de R$ 30,00, descontado do valor final. Sem sinal, o agendamento não é realizado.\nCancelamentos com no mínimo 48 horas de antecedência para o sinal ser reembolsado."};
const $=id=>document.getElementById(id),R=v=>"R$ "+Number(v).toFixed(2).replace(".",",");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString("sv")};
const hoje=iso(0),br=d=>d.split("-").reverse().join("/");
function toast(t){const x=$("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2200)}

/* banco de mentira para a demonstração */
const PH="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8e9d0"/><stop offset="1" stop-color="#d9b06a"/></linearGradient></defs><rect width="400" height="500" fill="url(#g)"/><text x="200" y="270" font-size="90" text-anchor="middle" fill="#8f6420">✦</text></svg>');
const DEMO_RES=[["Maquiagem Social",130],["Design de Sobrancelhas Simples",40],["Lash Lifting",150]].map((x,i)=>({id:"r"+i,title:x[0],price:x[1],image_url:PH,fit:"cover",zoom:1,ox:0,oy:0,bright:100,contrast:100,active:true,sort:i+1}));
function fake(){let uid=100;const mem={
 bookings:[{id:1,client_name:"Ana Paula Souza",phone:"(85) 99911-2233",services:[{name:"Maquiagem Social",price:100}],total:100,dia:iso(0),hora:"10:00"},
  {id:2,client_name:"Mariana Lopes",phone:"(85) 98877-6655",services:[{name:"Design de Sobrancelhas",price:100},{name:"Buço",price:100}],total:200,dia:iso(0),hora:"15:00"},
  {id:3,client_name:"Juliana Alves",phone:"(85) 99700-1122",services:[{name:"Lash Lifting",price:100},{name:"Brow Lamination",price:100}],total:200,dia:iso(2),hora:"09:00"},
  {id:4,client_name:"Camila Ribeiro",phone:"(85) 98123-4567",services:[{name:"Maquiagem Social",price:100}],total:100,dia:iso(5),hora:"14:00"}],
 services:[["Maquiagem Social","Acabamento impecável e duradouro para o seu evento.","Maquiagem",130],["Design de Sobrancelhas Simples","Modelagem personalizada para o formato do seu rosto.","Sobrancelha",40],["Design de Sobrancelhas com Henna","Design com henna para realçar o preenchimento e a definição dos fios.","Sobrancelha",50],["Design de Sobrancelhas com Tintura","Design com tintura para uma sobrancelha mais marcada e natural.","Sobrancelha",50],["Brow Lamination","Fios alinhados para uma sobrancelha cheia e definida.","Sobrancelha",130],["Lash Lifting","Cílios levantados e curvados, com olhar aberto por semanas. Não realizamos extensão de cílios.","Cílios",150],["Buço","Remoção rápida e delicada, com acabamento suave.","Epilação",100,false]].map((x,i)=>({id:"s"+i,name:x[0],description:x[1],category:x[2],price:x[3],active:x[4]!==false,sort:i})),
 blocked:[{id:9,dia:iso(8),hora:null,motivo:"Compromisso pessoal"}],settings:[],photos:DEMO_RES};
 return t=>{const f=[],o=[];const q={op:"sel",
  select(){return q},gte(c,v){f.push(r=>r[c]>=v);return q},eq(c,v){f.push(r=>String(r[c])===String(v));return q},order(c){o.push(c);return q},
  delete(){q.op="del";return q},update(v){q.op="upd";q.v=v;return q},insert(v){q.op="ins";q.v=v;return q},
  upsert(v){q.op="ups";q.v=v;return q},
  then(ok){let r=mem[t],data=null;
   if(q.op==="ins")mem[t].push({id:++uid,...q.v});
   else if(q.op==="upd")r.filter(x=>f.every(g=>g(x))).forEach(x=>Object.assign(x,q.v));
   else if(q.op==="del")mem[t]=r.filter(x=>!f.every(g=>g(x)));
   else if(q.op==="ups")q.v.forEach(n=>{const x=r.find(y=>y.key===n.key);x?Object.assign(x,n):r.push(n)});
   else data=r.filter(x=>f.every(g=>g(x))).sort((a,b)=>{for(const c of o){if(a[c]!==b[c])return(a[c]??"")>(b[c]??"")?1:-1}return 0});
   return Promise.resolve({data,error:null}).then(ok)}};return q}}
const db=DEMO?{auth:{getSession:async()=>({data:{session:{}}}),signInWithPassword:async()=>({error:null}),signOut:async()=>{}},from:fake()}:supabase.createClient(SB_URL,SB_KEY);

let cfg={...DEF};
async function boot(){const {data:{session}}=await db.auth.getSession();
 $("dm").classList.toggle("hide",!DEMO);$("login").classList.toggle("hide",!!session);$("app").classList.toggle("hide",!session);
 if(session){await loadCfg();loadAg();loadSv();loadDi();loadSt();loadFt()}}
$("login").onsubmit=async e=>{e.preventDefault();
 const {error}=await db.auth.signInWithPassword({email:$("em").value,password:$("pw").value});
 error?$("lerr").textContent="E-mail ou senha incorretos.":boot()};
$("out").onclick=async()=>{await db.auth.signOut();boot()};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
 ["ag","sv","di","st","ft"].forEach(k=>$(k).classList.toggle("hide",k!==t.dataset.t))});
async function loadCfg(){const {data}=await db.from("settings").select("*");cfg={...DEF};(data||[]).forEach(r=>cfg[r.key]=r.value)}

/* AGENDAMENTOS */
async function loadAg(){
 const {data,error}=await db.from("bookings").select("*").gte("dia",hoje).order("dia").order("hora");
 if(error)return $("ag").textContent="Erro ao carregar.";
 const sem=iso(7),h=data.filter(b=>b.dia===hoje).length,s7=data.filter(b=>b.dia<=sem).length,tot=data.reduce((a,b)=>a+Number(b.total),0);
 let html=`<div class="stats"><div class="stat"><b>${h}</b><span>Hoje</span></div><div class="stat"><b>${s7}</b><span>Próx. 7 dias</span></div><div class="stat"><b>${R(tot)}</b><span>Previsto</span></div></div>`;
 let last="";
 data.forEach(b=>{if(b.dia!==last){last=b.dia;html+=`<div class="day">${b.dia===hoje?"Hoje":b.dia===iso(1)?"Amanhã":br(b.dia)} · ${br(b.dia)}</div>`}
  html+=`<div class="box bk"><div class="hr">${esc(b.hora)}</div><div><b>${esc(b.client_name)}</b>
  <div class="muted">${(b.services||[]).map(s=>esc(s.name)).join(", ")} · ${R(b.total)}<br>WhatsApp: <a href="https://wa.me/55${esc(b.phone.replace(/\D/g,""))}" target="_blank" style="color:var(--gold2)">${esc(b.phone)}</a></div></div>
  <button class="d" data-id="${b.id}">Cancelar</button></div>`});
 $("ag").innerHTML=html+(data.length?"":'<p class="muted">Nenhum agendamento futuro.</p>')}
$("ag").onclick=async e=>{const id=e.target.dataset.id;if(!id)return;
 if(!confirm("Cancelar e apagar este agendamento? O horário voltará a ficar livre."))return;
 const {error}=await db.from("bookings").delete().eq("id",id);
 toast(error?"Erro ao cancelar":"Agendamento cancelado, horário liberado");loadAg()};

/* SERVICOS */
async function loadSv(){
 const {data}=await db.from("services").select("*").order("sort").order("name");
 $("sv").innerHTML=(data||[]).map(s=>`<div class="box row" data-id="${s.id}">
 <input class="n" value="${esc(s.name)}" placeholder="Nome"><input class="cg" list="cats" value="${esc(s.category)}" placeholder="Categoria"><input class="sm pr" type="number" step="0.01" min="0" value="${s.price}">
 <input class="ds" value="${esc(s.description)}" placeholder="Descrição" style="flex:1 1 100%">
 <label style="margin:0;flex:1 1 140px"><input class="ac" type="checkbox" style="width:auto" ${s.active?"checked":""}> Visível no site</label>
 <button class="p" data-a="save">Salvar</button><button class="d" data-a="del">Excluir</button></div>`).join("")+
 `<div class="box"><h3>Novo serviço</h3><div class="row"><input id="nn" placeholder="Nome"><input id="nc" list="cats" placeholder="Categoria"><input id="np" class="sm" type="number" value="100" step="0.01"><input id="nd" placeholder="Descrição" style="flex:1 1 100%"><button class="p" id="add">Adicionar</button></div></div>`;
 $("add").onclick=async()=>{if(!$("nn").value.trim())return toast("Informe o nome");
  const {error}=await db.from("services").insert({name:$("nn").value.trim(),category:$("nc").value||"Outros",price:$("np").value||0,description:$("nd").value,active:true,sort:99});
  toast(error?"Erro ao adicionar":"Serviço adicionado");loadSv()}}
$("sv").onclick=async e=>{const a=e.target.dataset.a;if(!a)return;const r=e.target.closest(".box"),id=r.dataset.id;
 if(a==="save"){const {error}=await db.from("services").update({name:r.querySelector(".n").value,category:r.querySelector(".cg").value||"Outros",price:r.querySelector(".pr").value,description:r.querySelector(".ds").value,active:r.querySelector(".ac").checked}).eq("id",id);toast(error?"Erro ao salvar":"Salvo")}
 if(a==="del"&&confirm("Excluir este serviço?")){await db.from("services").delete().eq("id",id);toast("Serviço excluído");loadSv()}};

/* DISPONIBILIDADE */
async function loadDi(){
 const horas=cfg.horarios.split(",").map(x=>x.trim()).filter(Boolean);
 const {data}=await db.from("blocked").select("*").gte("dia",hoje).order("dia").order("hora");
 $("di").innerHTML=`<div class="box"><h3>Bloquear dia ou horário</h3><p class="muted">Dia de folga, compromisso ou imprevisto: a cliente verá como indisponível.</p>
 <div class="row"><input type="date" id="bd" min="${hoje}"><select id="bh"><option value="">Dia inteiro</option>${horas.map(h=>`<option>${esc(h)}</option>`).join("")}</select>
 <input id="bm" placeholder="Motivo (só você vê)"><button class="p" id="bb">Bloquear</button></div></div>`+
 (data||[]).map(b=>`<div class="box row"><span><b>${br(b.dia)}</b> · ${b.hora?esc(b.hora):"Dia inteiro"} <span class="muted">${esc(b.motivo)}</span></span><button class="d" data-id="${b.id}">Liberar</button></div>`).join("");
 $("bb").onclick=async()=>{if(!$("bd").value)return toast("Escolha a data");
  const {error}=await db.from("blocked").insert({dia:$("bd").value,hora:$("bh").value||null,motivo:$("bm").value});
  toast(error?"Erro ao bloquear":"Bloqueado");loadDi()}}
$("di").onclick=async e=>{const id=e.target.dataset.id;if(!id)return;await db.from("blocked").delete().eq("id",id);toast("Horário liberado");loadDi()};

/* SITE */
function loadSt(){
 const f=(k,l,t)=>`<label>${l}</label>${t?`<textarea id="s_${k}">${esc(cfg[k])}</textarea>`:`<input id="s_${k}" value="${esc(cfg[k])}">`}`;
 $("st").innerHTML=`<div class="box"><h3>Textos do site</h3>${f("slogan","Frase abaixo do nome")}${f("intro","Texto da capa")}${f("regras","Informações importantes (uma por linha)",1)}</div>
 <div class="box"><h3>Agendamento</h3>${f("whatsapp","WhatsApp (DDI+DDD+número, só números)")}${f("sinal","Valor do sinal (R$)")}${f("horarios","Horários de atendimento (separados por vírgula)")}</div>
 <button class="p" id="ss" style="width:100%">Salvar alterações do site</button>`;
 $("ss").onclick=async()=>{const {error}=await db.from("settings").upsert(Object.keys(DEF).map(k=>({key:k,value:$("s_"+k).value.trim()})));
  toast(error?"Erro ao salvar":"Site atualizado");await loadCfg();loadDi()}}
/* FOTOS */
const FS=["title","price","image_url","fit","zoom","ox","oy","bright","contrast","active","sort"];
const tf=r=>`transform:translate(${+r.ox||0}%,${+r.oy||0}%) scale(${+r.zoom||1});filter:brightness(${+r.bright||100}%) contrast(${+r.contrast||100}%)`;
let FL=[],E=null,pickMode="new";
async function loadFt(){
 const [{data,error},sv]=await Promise.all([db.from("photos").select("*").order("sort"),db.from("services").select("name")]);
 $("svn").innerHTML=(sv.data||[]).map(x=>`<option>${esc(x.name)}</option>`).join("");
 if(error){$("ft").innerHTML='<div class="box"><b>A galeria de fotos ainda não foi criada no banco.</b><p class="muted">Rode o arquivo o SQL das fotos no Supabase (SQL Editor) e recarregue esta página.</p></div>';return}
 FL=data||[];
 $("ft").innerHTML=`<div class="box"><h3>Fotos dos resultados</h3><p class="muted">Aparecem no carrossel do site, na ordem abaixo.</p><button class="p" id="fadd" type="button">+ Adicionar foto</button></div>`+
 FL.map((r,i)=>`<div class="box ph-row" data-id="${r.id}"><div class="th ${r.fit==="contain"?"ct":""}" style="--im:url('${esc(r.image_url)}')"><img src="${esc(r.image_url)}" alt="" style="${tf(r)}"></div>
 <div><b>${esc(r.title)}</b><div class="muted">${r.price!=null&&r.price!==""?R(r.price):"Sem valor"}${r.active?"":" · escondida"}</div></div>
 <div class="row" style="flex:0 0 auto;flex-direction:column;gap:6px"><div class="row" style="gap:6px"><button type="button" data-a="up" ${i?"":"disabled"}>▲</button><button type="button" data-a="dn" ${i<FL.length-1?"":"disabled"}>▼</button></div><button class="p" type="button" data-a="ed">Editar</button><button class="d" type="button" data-a="del">Excluir</button></div></div>`).join("")+(FL.length?"":'<p class="muted">Nenhuma foto ainda.</p>');
 $("fadd").onclick=()=>{pickMode="new";$("fpick").click()}}
$("ft").onclick=async e=>{const a=e.target.dataset.a,box=e.target.closest("[data-id]");if(!a||!box)return;
 const i=FL.findIndex(x=>String(x.id)===box.dataset.id),r=FL[i];
 if(a==="ed")return openE(r);
 if(a==="del"){if(!confirm("Excluir esta foto do site?"))return;await db.from("photos").delete().eq("id",r.id);toast("Foto excluída");return loadFt()}
 const o=FL[a==="up"?i-1:i+1];if(!o)return;
 await db.from("photos").update({sort:o.sort}).eq("id",r.id);await db.from("photos").update({sort:r.sort}).eq("id",o.id);loadFt()};
async function prep(file){const u=URL.createObjectURL(file);
 const im=await new Promise((ok,no)=>{const x=new Image();x.onload=()=>ok(x);x.onerror=no;x.src=u});
 const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
 c.getContext("2d").drawImage(im,0,0,c.width,c.height);
 return new Promise(ok=>c.toBlob(ok,"image/jpeg",.85))}
async function sendImg(file){const b=await prep(file);if(DEMO)return URL.createObjectURL(b);
 const name=(crypto.randomUUID?crypto.randomUUID():Date.now())+".jpg";
 const {error}=await db.storage.from("photos").upload(name,b,{contentType:"image/jpeg"});
 if(error)throw error;return db.storage.from("photos").getPublicUrl(name).data.publicUrl}
$("fpick").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{toast("Enviando foto...");const url=await sendImg(f);
  if(pickMode==="new")openE({title:"",price:null,image_url:url,fit:"cover",zoom:1,ox:0,oy:0,bright:100,contrast:100,active:true,sort:(FL.reduce((a,x)=>Math.max(a,x.sort||0),0)+1)});
  else{E.image_url=url;applyE()}}catch(err){console.error(err);toast("Não foi possível enviar a foto")}};
function applyE(){const i=$("fi");i.src=E.image_url;$("fr").style.setProperty("--im",`url('${E.image_url}')`);$("fr").classList.toggle("ct",E.fit==="contain");
 i.style.cssText=tf(E);$("fcn").textContent=E.title||"Nome da foto";$("fcp").textContent=E.price!=null&&E.price!==""?R(E.price):"";$("zv").textContent=(+E.zoom).toFixed(2)+"x"}
function openE(r){E={...r};$("edt").textContent=r.id?"Editar foto":"Nova foto";
 $("e_t").value=E.title;$("e_p").value=E.price??"";$("e_z").value=E.zoom;$("e_b").value=E.bright;$("e_c").value=E.contrast;$("e_f").value=E.fit;$("e_a").checked=!!E.active;
 $("ed").classList.remove("hide");applyE()}
const lim=()=>(E.zoom-1)*50+15,cl=v=>Math.max(-lim(),Math.min(lim(),v));
$("e_t").oninput=e=>{E.title=e.target.value;applyE()};
$("e_p").oninput=e=>{E.price=e.target.value===""?null:Number(e.target.value);applyE()};
$("e_z").oninput=e=>{E.zoom=+e.target.value;E.ox=cl(E.ox);E.oy=cl(E.oy);applyE()};
$("e_b").oninput=e=>{E.bright=+e.target.value;applyE()};$("e_c").oninput=e=>{E.contrast=+e.target.value;applyE()};
$("e_f").onchange=e=>{E.fit=e.target.value;applyE()};$("e_a").onchange=e=>E.active=e.target.checked;
$("e_rs").onclick=()=>{E.zoom=1;E.ox=0;E.oy=0;E.bright=100;E.contrast=100;$("e_z").value=1;$("e_b").value=100;$("e_c").value=100;applyE()};
$("e_ph").onclick=()=>{pickMode="swap";$("fpick").click()};
$("e_x").onclick=()=>$("ed").classList.add("hide");
let dr=null;const fr=$("fr");
fr.onpointerdown=e=>{dr={x:e.clientX,y:e.clientY,ox:E.ox,oy:E.oy};fr.setPointerCapture(e.pointerId);fr.style.cursor="grabbing"};
fr.onpointermove=e=>{if(!dr)return;const r=fr.getBoundingClientRect();E.ox=cl(dr.ox+(e.clientX-dr.x)/r.width*100);E.oy=cl(dr.oy+(e.clientY-dr.y)/r.height*100);applyE()};
fr.onpointerup=fr.onpointercancel=()=>{dr=null;fr.style.cursor="grab"};
fr.onwheel=e=>{e.preventDefault();E.zoom=Math.max(1,Math.min(3,E.zoom-e.deltaY*.002));E.ox=cl(E.ox);E.oy=cl(E.oy);$("e_z").value=E.zoom;applyE()};
$("e_s").onclick=async()=>{if(!E.title.trim())return toast("Dê um nome à foto");
 const d={};FS.forEach(k=>d[k]=E[k]);d.title=d.title.trim();
 const {error}=E.id?await db.from("photos").update(d).eq("id",E.id):await db.from("photos").insert(d);
 if(error){console.error(error);return toast("Erro ao salvar a foto")}
 $("ed").classList.add("hide");toast("Foto salva");loadFt()};
boot();
</script>
